name: Build and test Python MapScript

# Legacy C/C++ CI is skipped on the rust-port branch, which only touches rust/.
on:
  push:
    branches-ignore: [rust-port]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", 3.11, 3.12, 3.13, 3.14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and Install Dependencies
        run: |
            docker run \
            -e WORK_DIR="$PWD" \
            -e PYTHON_VERSION="${{ matrix.python-version }}" \
            -e MAPSCRIPT_PYTHON_ONLY="true" \
            -v $PWD:$PWD ubuntu:24.04 $PWD/scripts/build-mapscript-python.sh
