name: Code Checks

# Legacy C/C++ CI is skipped for changes that only touch rust/.
on:
  push:
    paths-ignore: ['rust/**']
  pull_request:
    paths-ignore: ['rust/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
