name: Build and test PHP MapScript

# Legacy C/C++ CI is skipped for changes that only touch rust/.
on:
  push:
    paths-ignore: ['rust/**']
  pull_request:
    paths-ignore: ['rust/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: [8.5, 8.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP and Install Dependencies
        run: |
            docker run \
            -e WORK_DIR="$PWD" \
            -e PHP_VERSION="${{ matrix.php-version }}" \
            -v $PWD:$PWD ubuntu:24.04 $PWD/scripts/build-mapscript-php.sh
